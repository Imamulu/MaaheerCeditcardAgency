<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaheer Credit Card Agency</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 450px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .header {
            background: linear-gradient(180deg, #001f3f 0%, #003366 100%);
            color: white;
            text-align: center;
            padding: 25px 15px;
            border-bottom: 4px solid #ffd700;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 15px;
            color: #ffd700;
            font-weight: 500;
        }

        /* Services Section */
        .content {
            padding: 20px 15px;
        }

        .service-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .service-card:active {
            transform: scale(0.98);
        }

        .details-bar {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #333;
            background: #fff;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: none;
        }

        /* Colors as per your image */
        .payswitch .login-btn { background-color: #001f3f; color: white; }
        
        .greenpay .login-btn { background-color: #28a745; color: white; }
        
        .shadvalpay .login-btn { 
            background-color: #ffffff; 
            color: #001f3f; 
            border-top: 1px solid #eee; 
            box-shadow: inset 0 -3px 0 #eee;
        }
        
        .credpay .login-btn { 
            background-color: #ffffff; 
            color: #001f3f; 
            border-top: 1px solid #eee; 
            box-shadow: inset 0 -3px 0 #eee;
        }

        /* Footer & Contact */
        .footer {
            text-align: center;
            padding: 30px 20px;
        }

        .contact-text {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .contact-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 16px;
        }

        .call-btn { background-color: #007bff; }
        .whatsapp-btn { background-color: #25d366; }

    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1>Maaheer Credit Card Agency</h1>
        <p>త్వరగా • నమ్మకంగా • సురక్షితమైన డిజిటల్ సేవలు</p>
    </div>

    <div class="content">
        <div class="service-card payswitch">
            <div class="details-bar">PaySwitch Details <span>▼</span></div>
            <a href="https://retailer.payswitch.co.in/" target="_blank" class="login-btn">PaySwitch Login</a>
        </div>

        <div class="service-card greenpay">
            <div class="details-bar">GreenPay Details <span>▼</span></div>
            <a href="https://vendor.greenpaynetwork.co.in/login" target="_blank" class="login-btn">GreenPay Login</a>
        </div>

        <div class="service-card shadvalpay">
            <div class="details-bar">shadvalpay Details <span>▼</span></div>
            <a href="https://merchant.shadvalpay.co.in/login/login?ReturnUrl=%2f" target="_blank" class="login-btn">ShadvalPay Login</a>
        </div>

        <div class="service-card credpay">
            <div class="details-bar">credpay Details <span>▼</span></div>
            <a href="https://credpay.cpd.net.in/login" target="_blank" class="login-btn">CredPay Login</a>
        </div>
    </div>

    <div class="footer">
        <div class="contact-text">సంప్రదించండి: 8978323221</div>
        <div class="btn-group">
            <a href="tel:8978323221" class="contact-btn call-btn">
                <i class="fas fa-phone-alt"></i> Call
            </a>
            <a href="https://wa.me/918978323221" class="contact-btn whatsapp-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>
    </div>
</div>

</body>
</html>
