<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaheer Credit Card Agency</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #f4f4f4; 
        }
        .btn-container { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            width: 90%; 
            max-width: 400px; 
        }
        .btn {
            background-color: #001a40;
            color: white;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:active {
            background-color: #003380;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="btn-container">
        <a href="https://vendor.greenpaynetwork.co.in/login" class="btn">GreenPay Login</a>
        
        <a href="https://retailer.payswitch.co.in/login" class="btn">PaySwitch Login</a>
        
        <a href="https://merchant.shadvalpay.co.in/login/login?ReturnUrl=%2f" class="btn">ShadvalPay Login</a>
        
        <a href="https://credpay.cpd.net.in/login" class="btn">CredPay Login</a>
    </div>

</body>
</html>
