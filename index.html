<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaheer Credit Card Agency</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 450px;
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* Header Styling */
        .header {
            background: linear-gradient(180deg, #001f3f 0%, #003366 100%);
            color: white;
            text-align: center;
            padding: 20px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 14px;
            color: #ffd700; /* Gold color for Telugu text */
        }

        /* Services Section */
        .content {
            padding: 15px;
        }

        .service-card {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .details-bar {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #003366;
            background: #fff;
        }

        .login-btn {
            display: block;
            width: 100%;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        /* Color Variants */
        .payswitch .login-btn { background-color: #001f3f; color: white; }
        .greenpay .login-btn { background-color: #28a745; color: white; }
        .shadvalpay .login-btn { background-color: #ffffff; color: #003366; border-top: 1px solid #eee; }
        .credpay .login-btn { background-color: #ffffff; color: #003366; border-top: 1px solid #eee; }

        .login-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* Contact Section */
        .footer {
            text-align: center;
            padding: 20px;
        }

        .contact-text {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .contact-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .call-btn { background-color: #007bff; }
        .whatsapp-btn { background-color: #25d366; }

    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1>Maaheer Credit Card Agency</h1>
        <p>త్వరగా • నమ్మకంగా • సురక్షితమైన డిజిటల్ సేవలు</p>
    </div>

    <div class="content">
        <div class="service-card payswitch">
            <div class="details-bar">PaySwitch Details <span>▼</span></div>
            <a href=https://retailer.payswitch.co.in/</a>
        </div>

        <div class="service-card greenpay">
            <div class="details-bar">GreenPay Details <span>▼</span></div>
            <a href=https://vendor.greenpaynetwork.co.in/login</a>
        </div>

        <div class="service-card shadvalpay">
            <div class="details-bar">shadvalpay Details <span>▼</span></div>
            <a href=https://merchant.shadvalpay.co.in/login/login?ReturnUrl=%2f</a>
        </div>

        <div class="service-card credpay">
            <div class="details-bar">credpay Details <span>▼</span></div>
            <a href=https://credpay.cpd.net.in/login</a>
        </div>
    </div>

    <div class="footer">
        <div class="contact-text">సంప్రదించండి: 8978323221</div>
        <div class="btn-group">
            <a href="tel:8978323221" class="contact-btn call-btn">
                <i class="fas fa-phone-alt"></i> Call
            </a>
            <a href="https://wa.me/918978323221" class="contact-btn whatsapp-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>
    </div>
</div>

</body>
</html>
